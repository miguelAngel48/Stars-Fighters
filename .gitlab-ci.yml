stages:
  - build
  - test
  - e2e
  - deploy

build_backend:
  stage: build
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - mvn clean compile

test_backend_unit:
  stage: test
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - mvn test

build_frontend:
  stage: build
  image: node:20-alpine
  script:
    - cd "frontend/Stars Fighters"
    - npm ci
    - npm run build

test_frontend_unit:
  stage: test
  image: node:20-alpine
  script:
    - cd "frontend/Stars Fighters"
    - npm ci
    - npm test

test_e2e:
  stage: e2e
  image:
    name: cypress/included:latest
    entrypoint: [""]
  script:
    - rm -rf node_modules package.json package-lock.json
    - cd "frontend/Stars Fighters"
    - rm -rf node_modules
    - npm ci
    - npm run test:e2e
  allow_failure: true

deploy_vm:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $VM_HOST >> ~/.ssh/known_hosts
  script:
    - rsync -avz --exclude='.git' --exclude='node_modules' --exclude='target' ./ root@$VM_HOST:~/stars-fighters/
    - ssh root@$VM_HOST "cd ~/stars-fighters && docker compose down && docker compose up -d --build"
  only:
    - main