stages:
  - build
  - test
  - deploy
  - e2e

build_backend:
  stage: build
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - mvn clean compile

test_backend_unit:
  stage: test
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - mvn test

build_frontend:
  stage: build
  image: node:20-alpine
  script:
    - cd "frontend/Stars Fighters"
    - npm ci
    - npm run build

test_frontend_unit:
  stage: test
  image: node:20-alpine
  script:
    - cd "frontend/Stars Fighters"
    - npm ci
    - npm test

test_e2e:
  stage: e2e
  image: cypress/included:15.17.0
  script:
    - cd "frontend/Stars Fighters"
    - npm ci
    - npm run test:e2e
  allow_failure: true

deploy_vm:
  stage: deploy
  image: ubuntu:latest
  script:
    - apt-get update -y && apt-get install openssh-client rsync -y
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - rsync -avz -e "ssh -p $SSH_PORT" --exclude='.git' --exclude='node_modules' --exclude='target' ./ $SSH_HOST:~/stars-fighters/
    - ssh -p $SSH_PORT $SSH_HOST "cd ~/stars-fighters && docker compose down && docker compose up -d --build"
  only:
    - main