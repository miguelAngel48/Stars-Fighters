version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stars_fighters
      MYSQL_USER: Miguel
      MYSQL_PASSWORD: miguel
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pma_starsfighters
    restart: always
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_ARBITRARY: 1
    ports:
      - "8085:80"

  backend:
    build:
      context: .
    container_name: backend
    restart: always
    ports:
      - "8090:8080" #
    environment:
      - DB_URL=jdbc:mysql://db:3306/stars_fighters?allowPublicKeyRetrieval=true&useSSL=false
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: "./frontend/Stars Fighters"
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    ports:
      - "3001:80" #
    depends_on:
      - backend

volumes:
  db_data: